name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Dart ${{ matrix.DART_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest SDK the packages support (`environment.sdk`).
          - DART_VERSION: 3.6.0
          # The current stable release.
          - # renovate: datasource=dart-version depName=dart
            DART_VERSION: 3.13.5
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.DART_VERSION }}

      - name: Setup / Dependencies
        run: dart pub get

      - name: Validate / Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Validate / Analyze
        run: dart analyze --fatal-infos

      - name: Validate / Test (messageformat)
        run: dart test
        working-directory: messageformat

      - name: Validate / Test (messageformat_datetime)
        run: dart test
        working-directory: messageformat_datetime

  # Single required status check for the branch ruleset (shown as "CI / Summary").
  # The matrix job names include the SDK version, so requiring them directly
  # would silently drop a check whenever the minimum SDK moves.
  summary:
    name: Summary
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        env:
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "Test: ${TEST}"
          # No job here is skipped on purpose, so anything but success fails.
          if [ "${TEST}" != success ]; then
            echo "::error::Job failed: Test (${TEST})"
            exit 1
          fi
          echo "All jobs succeeded."
