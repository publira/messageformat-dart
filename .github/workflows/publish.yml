name: Publish

# Publishes a package to pub.dev when its release tag is pushed, through
# pub.dev's automated publishing with GitHub OIDC. Tags name the package so
# that each package in the workspace can be released on its own:
# `messageformat-v1.2.3` publishes `messageformat` 1.2.3.
#
# pub.dev accepts the upload only if the package's admin page enables
# publishing from this repository with the tag pattern
# `messageformat-v{{version}}` and the environment `pub.dev`, and the first
# version of a package was published manually.

on:
  push:
    tags:
      - 'messageformat-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish messageformat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pub.dev
    permissions:
      contents: read
      # Requests the OIDC token that pub.dev authenticates the upload with.
      id-token: write
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without an `sdk` input, this installs the current stable release.
      # It also configures `dart pub` to authenticate with the OIDC token.
      - name: Setup / Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Setup / Dependencies
        run: dart pub get

      - name: Validate / Test
        run: dart test
        working-directory: messageformat

      - name: Validate / Dry run
        run: dart pub publish --dry-run
        working-directory: messageformat

      - name: Publish
        run: dart pub publish --force
        working-directory: messageformat
